<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect width="1100" height="560" fill="white"/>
<text x="550" y="46" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">DCMM 成熟度五级：每级都要通过上一级的全部要求</text>
<rect x="50" y="398" width="200" height="72" rx="10" fill="#f1f5f9"/><text x="150.0" y="432" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a5f">1 初始级</text><text x="150.0" y="460" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">被动响应需求，无统一数据管理</text><text x="150.0" y="480" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">，治理是随机的</text><rect x="240" y="326" width="200" height="144" rx="10" fill="#dbeafe"/><text x="340.0" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a5f">2 受管理级</text><text x="340.0" y="388" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">局部项目级有意识管理，但未覆</text><text x="340.0" y="408" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">盖全组织</text><rect x="430" y="254" width="200" height="216" rx="10" fill="#93c5fd"/><text x="530.0" y="288" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a5f">3 稳健级</text><text x="530.0" y="316" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">制度化：标准、流程、角色在组</text><text x="530.0" y="336" text-anchor="middle" font-size="13" fill="#1e3a5f" opacity="0.9">织级落地</text><rect x="620" y="182" width="200" height="288" rx="10" fill="#3b82f6"/><text x="720.0" y="216" text-anchor="middle" font-size="19" font-weight="bold" fill="white">4 量化管理级</text><text x="720.0" y="244" text-anchor="middle" font-size="13" fill="white" opacity="0.9">数据管理过程可量化度量、可预</text><text x="720.0" y="264" text-anchor="middle" font-size="13" fill="white" opacity="0.9">测</text><rect x="810" y="110" width="200" height="360" rx="10" fill="#1d4ed8"/><text x="910.0" y="144" text-anchor="middle" font-size="19" font-weight="bold" fill="white">5 优化级</text><text x="910.0" y="172" text-anchor="middle" font-size="13" fill="white" opacity="0.9">持续改进、与业务深度融合，行</text><text x="910.0" y="192" text-anchor="middle" font-size="13" fill="white" opacity="0.9">业标杆</text>
<text x="550" y="530" text-anchor="middle" font-size="14.5" fill="#64748b">等级越高，数据管理对组织的制度化、量化与持续改进要求越高——级别越高 ≠ 改进越好，须与业务价值对齐</text>
</svg>